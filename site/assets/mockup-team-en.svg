<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Plus Jakarta Sans, Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="t1" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4a2816" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- hesaplar -->
  <g filter="url(#t1)">
    <rect x="10" y="20" width="520" height="470" rx="20" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <text x="40" y="60" font-size="16" font-weight="800" fill="#1d1209">Accounts</text>
  <text x="40" y="80" font-size="12" fill="#8a6e5d">One list of who can sign in</text>

  <g>
    <rect x="40" y="100" width="460" height="64" rx="14" fill="#fff4ec" stroke="#ffcdb4"/>
    <circle cx="70" cy="132" r="16" fill="#ffeee4"/>
    <text x="70" y="137" font-size="11" font-weight="800" fill="#c9491f" text-anchor="middle">AY</text>
    <text x="98" y="127" font-size="13.5" font-weight="700" fill="#1d1209">Aslı Y.</text>
    <text x="98" y="146" font-size="11.5" fill="#8a6e5d">asli@okul.com</text>
    <rect x="330" y="118" width="76" height="28" rx="14" fill="#ff6b35"/>
    <text x="368" y="137" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Admin</text>
    <rect x="412" y="118" width="76" height="28" rx="14" fill="#ffffff" stroke="#ead9c9"/>
    <text x="450" y="137" font-size="11.5" font-weight="600" fill="#6b5445" text-anchor="middle">Instructor</text>
  </g>

  <g>
    <rect x="40" y="176" width="460" height="64" rx="14" fill="#ffffff" stroke="#ead9c9"/>
    <circle cx="70" cy="208" r="16" fill="#f4ece5"/>
    <text x="70" y="213" font-size="11" font-weight="800" fill="#8a6e5d" text-anchor="middle">KA</text>
    <text x="98" y="203" font-size="13.5" font-weight="700" fill="#1d1209">Kaan D.</text>
    <text x="98" y="222" font-size="11.5" fill="#8a6e5d">Linked to Kaan (instructor)</text>
    <rect x="412" y="194" width="76" height="28" rx="14" fill="#e6f0fe"/>
    <text x="450" y="213" font-size="11.5" font-weight="700" fill="#14396f" text-anchor="middle">Instructor</text>
  </g>

  <g>
    <rect x="40" y="252" width="460" height="64" rx="14" fill="#ffffff" stroke="#ead9c9"/>
    <circle cx="70" cy="284" r="16" fill="#f4ece5"/>
    <text x="70" y="289" font-size="11" font-weight="800" fill="#8a6e5d" text-anchor="middle">EL</text>
    <text x="98" y="279" font-size="13.5" font-weight="700" fill="#1d1209">Elif S.</text>
    <text x="98" y="298" font-size="11.5" fill="#8a6e5d">Linked to Elif (instructor)</text>
    <rect x="412" y="270" width="76" height="28" rx="14" fill="#e6f0fe"/>
    <text x="450" y="289" font-size="11.5" font-weight="700" fill="#14396f" text-anchor="middle">Instructor</text>
  </g>

  <g>
    <rect x="40" y="328" width="460" height="64" rx="14" fill="#ffffff" stroke="#ead9c9"/>
    <circle cx="70" cy="360" r="16" fill="#f4ece5"/>
    <text x="70" y="365" font-size="11" font-weight="800" fill="#8a6e5d" text-anchor="middle">SU</text>
    <text x="98" y="355" font-size="13.5" font-weight="700" fill="#1d1209">Su T.</text>
    <text x="98" y="374" font-size="11.5" fill="#c9491f">No role yet · sees nothing at all</text>
    <rect x="392" y="346" width="96" height="28" rx="14" fill="#fdf6ef" stroke="#ead9c9"/>
    <text x="440" y="365" font-size="11.5" font-weight="700" fill="#8a6e5d" text-anchor="middle">Give a role</text>
  </g>

  <rect x="40" y="410" width="460" height="52" rx="14" fill="#fff8f4" stroke="#ffdcc8"/>
  <text x="58" y="432" font-size="12" font-weight="700" fill="#c9491f">An instructor sees only their own column.</text>
  <text x="58" y="450" font-size="11.5" fill="#8a6e5d">Permission lives in the database, not the screen.</text>

  <!-- davet kartı -->
  <g filter="url(#t1)">
    <rect x="430" y="286" width="360" height="252" rx="20" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <text x="460" y="326" font-size="16" font-weight="800" fill="#1d1209">Instructor invitation</text>
  <text x="460" y="346" font-size="12" fill="#8a6e5d">No email is sent, you share the link yourself.</text>

  <rect x="460" y="362" width="300" height="42" rx="12" fill="#fdf6ef" stroke="#ead9c9"/>
  <text x="476" y="388" font-size="12" font-weight="600" fill="#6b5445">okul.app/davet/9f3k…2b</text>
  <rect x="690" y="371" width="60" height="24" rx="12" fill="#ffeee4"/>
  <text x="720" y="387" font-size="11" font-weight="700" fill="#c9491f" text-anchor="middle">Copy</text>

  <rect x="460" y="418" width="300" height="44" rx="22" fill="#e2f2ee" stroke="#b9ddd3"/>
  <circle cx="488" cy="440" r="12" fill="#0f8a72"/>
  <path d="M483 440a5 5 0 1 1 5 5l-6 1 1.6-3.4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="512" y="445" font-size="13" font-weight="700" fill="#0a5b4c">Send it on WhatsApp</text>

  <text x="460" y="492" font-size="11.5" fill="#8a6e5d">No account exists until the invitation is accepted;</text>
  <text x="460" y="510" font-size="11.5" fill="#8a6e5d">and an admin always decides the role.</text>
</svg>
