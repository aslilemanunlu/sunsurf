<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Plus Jakarta Sans, Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="k1" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4a2816" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- tek eğitmen kolonu -->
  <g filter="url(#k1)">
    <rect x="10" y="24" width="320" height="552" rx="20" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <circle cx="52" cy="62" r="15" fill="#ffeee4"/>
  <text x="52" y="67" font-size="11" font-weight="800" fill="#c9491f" text-anchor="middle">KA</text>
  <text x="78" y="59" font-size="14" font-weight="800" fill="#1d1209">Kaan</text>
  <text x="78" y="76" font-size="11.5" fill="#8a6e5d">Monday, 21 July</text>
  <line x1="10" y1="94" x2="330" y2="94" stroke="#f0e0d3"/>

  <g font-size="11.5" font-weight="600" fill="#a08a7a" text-anchor="end">
    <text x="58" y="128">09:00</text>
    <text x="58" y="190">10:00</text>
    <text x="58" y="252">11:00</text>
    <text x="58" y="314">12:00</text>
    <text x="58" y="376">13:00</text>
    <text x="58" y="438">14:00</text>
    <text x="58" y="500">15:00</text>
    <text x="58" y="556">16:00</text>
  </g>

  <g fill="#fff8f4" stroke="#ffdcc8">
    <rect x="72" y="110" width="240" height="54" rx="10"/>
    <rect x="72" y="420" width="240" height="54" rx="10"/>
    <rect x="72" y="482" width="240" height="54" rx="10"/>
  </g>

  <!-- sürükleme seçimi: üç saat -->
  <rect x="72" y="172" width="240" height="178" rx="12" fill="#ffeee4" stroke="#ff6b35" stroke-width="2.5"/>
  <text x="92" y="202" font-size="13" font-weight="800" fill="#c9491f">Selected: 10:00 → 13:00</text>
  <text x="92" y="224" font-size="12" fill="#a83c16">Three hours, one lesson</text>
  <circle cx="192" cy="272" r="22" fill="#ff6b35"/>
  <path d="M192 262v20M182 272h20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="192" y="318" font-size="12" font-weight="700" fill="#c9491f" text-anchor="middle">Let go and the lesson form opens</text>

  <!-- dolu saat -->
  <rect x="72" y="358" width="240" height="54" rx="10" fill="#e6f0fe" stroke="#b9d3fb"/>
  <rect x="72" y="358" width="4" height="54" rx="2" fill="#1f6feb"/>
  <text x="90" y="380" font-size="12.5" font-weight="700" fill="#14396f">Selin Kaya</text>
  <text x="90" y="398" font-size="11.5" fill="#3d6394">Windsurf · individual</text>

  <text x="72" y="558" font-size="11.5" fill="#a08a7a">Mouse and pen only — a phone scrolls instead.</text>

  <!-- tekrar paneli -->
  <g filter="url(#k1)">
    <rect x="360" y="48" width="430" height="266" rx="20" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <text x="390" y="88" font-size="16" font-weight="800" fill="#1d1209">Repeat the lesson</text>
  <text x="390" y="108" font-size="12" fill="#8a6e5d">The same hour, across the days you choose</text>

  <rect x="390" y="124" width="120" height="34" rx="17" fill="#ffffff" stroke="#ead9c9"/>
  <text x="450" y="146" font-size="12.5" font-weight="600" fill="#6b5445" text-anchor="middle">Every day</text>
  <rect x="518" y="124" width="120" height="34" rx="17" fill="#ff6b35"/>
  <text x="578" y="146" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Weekdays</text>
  <rect x="646" y="124" width="114" height="34" rx="17" fill="#ffffff" stroke="#ead9c9"/>
  <text x="703" y="146" font-size="12.5" font-weight="600" fill="#6b5445" text-anchor="middle">Weekly</text>

  <text x="390" y="190" font-size="11" font-weight="700" fill="#8a6e5d">UNTIL</text>
  <rect x="390" y="198" width="180" height="34" rx="10" fill="#fdf6ef" stroke="#ead9c9"/>
  <text x="408" y="220" font-size="12.5" font-weight="600" fill="#1d1209">1 August</text>
  <rect x="582" y="198" width="178" height="34" rx="10" fill="#fdf6ef" stroke="#ead9c9"/>
  <text x="600" y="220" font-size="12.5" font-weight="600" fill="#1d1209">10 lessons will land</text>

  <rect x="390" y="250" width="370" height="42" rx="12" fill="#e2f2ee" stroke="#b9ddd3"/>
  <circle cx="414" cy="271" r="12" fill="#0f8a72"/>
  <path d="M408 271l4 4 8-9" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="436" y="276" font-size="12.5" font-weight="700" fill="#0a5b4c">8 written, 2 taken hours skipped</text>

  <!-- izin paneli -->
  <g filter="url(#k1)">
    <rect x="360" y="336" width="430" height="240" rx="20" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <text x="390" y="376" font-size="16" font-weight="800" fill="#1d1209">Leave</text>
  <text x="390" y="396" font-size="12" fill="#8a6e5d">Closes a date range for one instructor in one step</text>

  <rect x="390" y="412" width="180" height="34" rx="10" fill="#fdf6ef" stroke="#ead9c9"/>
  <text x="408" y="434" font-size="12.5" font-weight="600" fill="#1d1209">4 August</text>
  <path d="M580 429h16" stroke="#a08a7a" stroke-width="2" stroke-linecap="round"/>
  <rect x="606" y="412" width="154" height="34" rx="10" fill="#fdf6ef" stroke="#ead9c9"/>
  <text x="624" y="434" font-size="12.5" font-weight="600" fill="#1d1209">9 August</text>

  <rect x="390" y="462" width="370" height="60" rx="12" fill="#fff8f4" stroke="#ffdcc8"/>
  <text x="410" y="486" font-size="12.5" font-weight="700" fill="#c9491f">2 lessons in the range were left alone.</text>
  <text x="410" y="506" font-size="11.5" fill="#8a6e5d">Closing an hour and cancelling a lesson are different.</text>

  <rect x="390" y="534" width="140" height="34" rx="17" fill="#ff6b35"/>
  <text x="460" y="556" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Save leave</text>
  <text x="548" y="556" font-size="12.5" font-weight="600" fill="#8a6e5d">6 days will close</text>
</svg>
