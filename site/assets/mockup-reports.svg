  <rect x="420" y="404" width="322" height="48" rx="14" fill="#fff8f4" stroke="#ffdcc8"/>
  <circle cx="446" cy="428" r="13" fill="#ffeee4"/>
  <path d="M440 428l4 4 8-9" stroke="#c9491f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="468" y="425" font-size="12" font-weight="700" fill="#1d1209">Bugün, bu hafta, bu ay ya da seçtiğin tarihler</text>
  <text x="468" y="442" font-size="11.5" fill="#8a6e5d">Her eğitmen kendi saatini de görür.</text>
