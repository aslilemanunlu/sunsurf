  <rect x="540" y="580" width="118" height="34" rx="17" fill="#ff6b35"/>
  <text x="599" y="602" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Kaydet</text>
  <text x="676" y="602" font-size="12.5" font-weight="600" fill="#8a6e5d">Hafta içi tekrar</text>
