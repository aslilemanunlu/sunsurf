<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="Plus Jakarta Sans, Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="p1" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4a2816" flood-opacity="0.13"/>
    </filter>
    <filter id="p2" x="-40%" y="-60%" width="180%" height="240%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4a2816" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- paket listesi -->
  <g filter="url(#p1)">
    <rect x="10" y="24" width="470" height="520" rx="20" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <text x="38" y="64" font-size="16" font-weight="800" fill="#1d1209">Packages and balances</text>
  <text x="38" y="84" font-size="12" fill="#8a6e5d">Who took how many lessons, how many are left</text>

  <g>
    <rect x="38" y="102" width="414" height="94" rx="16" fill="#fff4ec" stroke="#ffcdb4"/>
    <text x="58" y="128" font-size="13.5" font-weight="700" fill="#1d1209">Ayşe Demir</text>
    <text x="58" y="146" font-size="11.5" fill="#8a6e5d">10 lesson package · 4 used</text>
    <rect x="58" y="158" width="300" height="10" rx="5" fill="#ffffff"/>
    <rect x="58" y="158" width="120" height="10" rx="5" fill="#ff6b35"/>
    <text x="58" y="184" font-size="11.5" font-weight="700" fill="#c9491f">6 lessons left</text>
    <rect x="356" y="118" width="80" height="26" rx="13" fill="#ffffff"/>
    <text x="396" y="135" font-size="11" font-weight="700" fill="#c9491f" text-anchor="middle">Lesson pack</text>
    <text x="436" y="184" font-size="12" font-weight="700" fill="#1d1209" text-anchor="end">Balance: 4.000</text>
  </g>

  <g>
    <rect x="38" y="210" width="414" height="94" rx="16" fill="#ffffff" stroke="#ead9c9"/>
    <text x="58" y="236" font-size="13.5" font-weight="700" fill="#1d1209">Can Yılmaz</text>
    <text x="58" y="254" font-size="11.5" fill="#8a6e5d">5 lesson package · 4 used</text>
    <rect x="58" y="266" width="300" height="10" rx="5" fill="#fdf6ef"/>
    <rect x="58" y="266" width="240" height="10" rx="5" fill="#ffb595"/>
    <text x="58" y="292" font-size="11.5" font-weight="700" fill="#a83c16">1 lesson left</text>
    <text x="436" y="292" font-size="12" font-weight="700" fill="#0f8a72" text-anchor="end">Balance: 0</text>
  </g>

  <g>
    <rect x="38" y="318" width="414" height="94" rx="16" fill="#ffffff" stroke="#ead9c9"/>
    <text x="58" y="344" font-size="13.5" font-weight="700" fill="#1d1209">Selin Kaya</text>
    <text x="58" y="362" font-size="11.5" fill="#8a6e5d">Season storage · June to September</text>
    <rect x="58" y="374" width="300" height="10" rx="5" fill="#fdf6ef"/>
    <rect x="58" y="374" width="180" height="10" rx="5" fill="#ffb595"/>
    <text x="58" y="400" font-size="11.5" font-weight="700" fill="#8a6e5d">2 months left</text>
    <text x="436" y="400" font-size="12" font-weight="700" fill="#1d1209" text-anchor="end">Balance: 1.500</text>
  </g>

  <g>
    <rect x="38" y="426" width="414" height="94" rx="16" fill="#ffffff" stroke="#ead9c9"/>
    <text x="58" y="452" font-size="13.5" font-weight="700" fill="#1d1209">Poyraz Toprak</text>
    <text x="58" y="470" font-size="11.5" fill="#8a6e5d">Kids camp · two weeks</text>
    <rect x="58" y="482" width="300" height="10" rx="5" fill="#fdf6ef"/>
    <rect x="58" y="482" width="90" height="10" rx="5" fill="#ffb595"/>
    <text x="58" y="508" font-size="11.5" font-weight="700" fill="#8a6e5d">8 days left</text>
    <text x="436" y="508" font-size="12" font-weight="700" fill="#1d1209" text-anchor="end">Balance: 2.250</text>
  </g>

  <!-- paket detayı -->
  <g filter="url(#p1)">
    <rect x="392" y="96" width="418" height="392" rx="20" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <circle cx="428" cy="140" r="20" fill="#ffeee4"/>
  <text x="428" y="146" font-size="13" font-weight="800" fill="#c9491f" text-anchor="middle">AD</text>
  <text x="460" y="136" font-size="17" font-weight="800" fill="#1d1209">Ayşe Demir</text>
  <text x="460" y="156" font-size="12" fill="#8a6e5d">A 10 lesson windsurf package</text>

  <line x1="420" y1="180" x2="782" y2="180" stroke="#f0e0d3"/>

  <g>
    <rect x="420" y="198" width="112" height="72" rx="14" fill="#fff8f4" stroke="#ffdcc8"/>
    <text x="476" y="228" font-size="21" font-weight="800" fill="#1d1209" text-anchor="middle">10</text>
    <text x="476" y="250" font-size="11" font-weight="600" fill="#8a6e5d" text-anchor="middle">in the package</text>

    <rect x="544" y="198" width="112" height="72" rx="14" fill="#fff8f4" stroke="#ffdcc8"/>
    <text x="600" y="228" font-size="21" font-weight="800" fill="#1d1209" text-anchor="middle">4</text>
    <text x="600" y="250" font-size="11" font-weight="600" fill="#8a6e5d" text-anchor="middle">used</text>

    <rect x="668" y="198" width="114" height="72" rx="14" fill="#ffeee4" stroke="#ffcdb4"/>
    <text x="725" y="228" font-size="21" font-weight="800" fill="#c9491f" text-anchor="middle">6</text>
    <text x="725" y="250" font-size="11" font-weight="600" fill="#a83c16" text-anchor="middle">credits left</text>
  </g>

  <g font-size="12.5">
    <text x="420" y="302" font-weight="600" fill="#8a6e5d">Agreed</text>
    <text x="782" y="302" font-weight="700" fill="#1d1209" text-anchor="end">12.000</text>
    <line x1="420" y1="316" x2="782" y2="316" stroke="#f4ece5"/>

    <text x="420" y="342" font-weight="600" fill="#8a6e5d">Collected</text>
    <text x="782" y="342" font-weight="700" fill="#0f8a72" text-anchor="end">8.000</text>
    <line x1="420" y1="356" x2="782" y2="356" stroke="#f4ece5"/>

    <text x="420" y="382" font-weight="700" fill="#1d1209">Remaining balance</text>
    <text x="782" y="382" font-weight="800" fill="#c9491f" text-anchor="end">4.000</text>
  </g>

  <rect x="420" y="404" width="362" height="62" rx="14" fill="#fff8f4" stroke="#ffdcc8"/>
  <circle cx="446" cy="435" r="13" fill="#ffeee4"/>
  <path d="M440 435l4 4 8-9" stroke="#c9491f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="468" y="430" font-size="12" font-weight="700" fill="#1d1209">One lesson spends one credit, however long it runs.</text>
  <text x="468" y="450" font-size="11.5" fill="#8a6e5d">If the lesson is cancelled, the credit goes back.</text>

  <!-- yüzen rozet -->
  <g filter="url(#p2)">
    <rect x="596" y="500" width="216" height="64" rx="18" fill="#ffffff" stroke="#f0e0d3"/>
  </g>
  <circle cx="626" cy="532" r="15" fill="#e2f2ee"/>
  <path d="M619 532l5 5 10-10" stroke="#0f8a72" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="528" font-size="12.5" font-weight="800" fill="#1d1209">Visible while booking</text>
  <text x="650" y="546" font-size="11.5" fill="#8a6e5d">Staff pick which package it comes off.</text>
</svg>
